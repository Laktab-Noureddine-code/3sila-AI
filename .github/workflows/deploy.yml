name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main # Make sure your default branch matches this name (e.g., main or master)

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 1. Navigate to the project directory
            cd /home/${{ secrets.SERVER_USERNAME }}/3sila-AI
            
            # 2. Pull the latest code from GitHub
            git fetch --all
            git reset --hard origin/main
            
            # 3. Navigate to the server folder and rebuild/restart the containers
            cd server
            docker compose down
            docker compose up -d --build
            
            # 4. Clean up old unused docker images to prevent running out of disk space
            docker image prune -f

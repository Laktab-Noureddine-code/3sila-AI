name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main # Runs the pipeline when you push to the 'main' branch. Change if your default branch is different.

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # The script below runs directly on your Oracle Server
          script: |
            # 1. Navigate to the project directory (Change this to your actual project path on the server)
            cd /home/${{ secrets.SERVER_USERNAME }}/3sila-AI
            
            # 2. Pull the latest code from GitHub
            git fetch --all
            git reset --hard origin/main
            
            # 3. Navigate to the server folder and rebuild/restart the containers
            cd server
            docker compose down
            docker compose up -d --build
            
            # 4. Clean up old unused docker images to prevent running out of Oracle's disk space
            docker image prune -f